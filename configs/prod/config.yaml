---
description: "Production environment config for Car Maintenance app"
environment: "prod"
version: "2.4.0"
last_updated: "2026-08-22"
---

version: 6

vehicle:
  year: 2021
  make: Mazda
  model: "3"
  initial_km: 40000
  initial_date: "2026-03-28"

mileage:
  weekday_km: 10
  weekend_km: 40
  due_soon_buffer_km: 1000
  due_soon_buffer_days: 14

airtable:
  tasks_table: Tasks
  mileage_table: Mileage
  maintenance_log_table: "Maintenance Log"

logging:
  level: WARNING
  retention_days: 30

rate_limiting:
  write_requests_per_minute: 10
  read_requests_per_minute: 60
  login_requests_per_minute: 5
  manual_qa_requests_per_minute: 10

dashboard_scan:
  max_image_size_mb: 10
  allowed_types:
    - image/jpeg
    - image/png
    - image/heic
    - image/webp
  min_km_plausible: 1000
  max_km_plausible: 500000
  model: "claude-haiku-4-5-20251001"

manual_qa:
  embedding_model: "BAAI/bge-small-en-v1.5"
  top_k_chunks: 5
  model: "claude-haiku-4-5-20251001"

vector_store:
  provider: local_file
